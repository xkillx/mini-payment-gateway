[workspace]
resolver = "2"
members = [
    "apps/api",
    "apps/worker",
    "apps/migrate",
    "crates/shared-config",
    "crates/shared-db",
    "crates/shared-http",
    "crates/shared-observability",
    "crates/shared-auth",
    "crates/payments",
    "crates/refunds",
    "crates/notifications",
    "crates/reconciliation",
    "crates/audit",
    "crates/reporting",
    "crates/admin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.19", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.6", features = ["trace", "cors", "request-id"] }
tower = "0.5"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
utoipa = "5"
utoipa-swagger-ui = { version = "8", features = ["axum"] }
base64 = "0.22"
rand = "0.8"
