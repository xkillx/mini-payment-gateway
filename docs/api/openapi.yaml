openapi: "3.0.3"
info:
  title: Mini Payment Gateway API
  version: "0.1.0"
  description: Backend API for the Mini Payment Gateway MVP

servers:
  - url: http://localhost:4000
    description: Local development

paths:
  /health:
    get:
      operationId: health
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 0.1.0

  /api/v1/payments:
    get:
      operationId: listPayments
      summary: List payments (Merchant or Administrator)
      description: |
        Returns a paginated list of Payments ordered by `created_at DESC, id DESC`.

        - Merchants always see only Payments owned by their own Merchant Account.
        - Administrators see all Payments unless `merchant_id` is supplied to filter to one Merchant Account.
        - Merchants that supply `merchant_id` receive `403` (forbidden), even if the value is malformed.
        - `search` matches an exact Payment ID (when the value parses as a UUID) and
          a case-insensitive partial Merchant Reference stored in
          `metadata.merchant_reference` (string values only).
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum number of items to return
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of items to skip
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PaymentStatus"
          description: Filter by exact Payment Status
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
          description: |
            Search term matched against Payment ID (exact UUID match) and
            `metadata.merchant_reference` (case-insensitive partial match).
            Whitespace is trimmed; empty or whitespace-only is treated as absent.
        - name: merchant_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: |
            Administrator-only filter to scope the list to a single Merchant Account.
            Merchants that supply this parameter receive `403`.
      responses:
        "200":
          description: Paginated list of Payments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createPayment
      summary: Create a payment (Merchant only)
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
          description: Unique key for idempotent payment creation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: Payment created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "200":
          description: Idempotent replay — same payment returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/payments/{id}:
    get:
      operationId: getPayment
      summary: Get a payment by ID (Merchant or Administrator)
      description: |
        Returns the full Payment Detail for a single Payment, including Payment Status History,
        related Refund summaries, and related Notification Delivery Records.

        Merchants may only view Payments owned by their own Merchant Account; access to any
        other Payment returns 404. Administrators may view any Payment.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Payment detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/refunds:
    get:
      operationId: listRefunds
      summary: List refunds (Merchant or Administrator)
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      operationId: createRefund
      summary: Create a refund (Merchant only)
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/refunds/{id}:
    get:
      operationId: getRefund
      summary: Get a refund by ID (Merchant or Administrator)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/notifications:
    get:
      operationId: listNotifications
      summary: List notification delivery records (Administrator only)
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/notifications/{id}/retry:
    post:
      operationId: retryNotification
      summary: Retry a failed notification (Administrator only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/reconciliation:
    get:
      operationId: listReconciliations
      summary: List reconciliation records (Administrator only)
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      operationId: runReconciliation
      summary: Run a reconciliation (Administrator only)
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/audit:
    get:
      operationId: listAuditRecords
      summary: List audit records (Administrator only)
      security:
        - bearerAuth: []
      parameters:
        - name: actor_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by actor ID
        - name: actor_type
          in: query
          required: false
          schema:
            type: string
            enum: [merchant, administrator, system, unknown]
          description: Filter by actor type
        - name: resource_type
          in: query
          required: false
          schema:
            type: string
          description: Filter by resource type
        - name: resource_id
          in: query
          required: false
          schema:
            type: string
          description: Filter by resource ID
        - name: action
          in: query
          required: false
          schema:
            type: string
          description: Filter by action name
        - name: occurred_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Include records occurred at or after this timestamp
        - name: occurred_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Include records occurred at or before this timestamp
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum number of records to return
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of records to skip
      responses:
        "200":
          description: List of audit records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditRecordListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/audit/{id}:
    get:
      operationId: getAuditRecord
      summary: Get an audit record by ID (Administrator only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Audit record ID
      responses:
        "200":
          description: Audit record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/reporting/payment-summary:
    get:
      operationId: paymentSummary
      summary: Get payment summary report (Administrator only)
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/admin/actors:
    get:
      operationId: listActors
      summary: List actors (Administrator only)
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Authentication failed — missing, malformed, expired, or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: UNAUTHORIZED
            message: Authentication failed
            request_id: "01901234-5678-7000-8000-000000000001"

    Forbidden:
      description: Authenticated actor lacks the required role
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: FORBIDDEN
            message: Insufficient permissions
            request_id: "01901234-5678-7000-8000-000000000002"

    NotImplemented:
      description: Not Implemented
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

    Conflict:
      description: The request conflicts with the current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ErrorEnvelope:
      type: object
      required:
        - code
        - message
        - request_id
      properties:
        code:
          type: string
          example: NOT_IMPLEMENTED
        message:
          type: string
          example: payments.list
        request_id:
          type: string
          format: uuid
        details:
          type: object
          nullable: true

    CreatePaymentRequest:
      type: object
      required:
        - amount_minor
        - currency
      properties:
        amount_minor:
          type: integer
          minimum: 1
          description: Payment Amount in minor units (e.g., cents)
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 currency code — must match the gateway's Configured Currency (default USD)
        metadata:
          type: object
          description: |
            Optional Payment Metadata for merchant reconciliation. Must be a JSON object
            ≤4096 bytes serialized. Defaults to {}.

            When `metadata.merchant_reference` is supplied as a string, it is the
            Merchant Reference used by payment search on `GET /api/v1/payments`.
          default: {}
      additionalProperties: false

    PaymentResponse:
      type: object
      required:
        - id
        - amount_minor
        - currency
        - status
        - metadata
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Payment ID
        amount_minor:
          type: integer
          description: Payment Amount in minor units
        currency:
          type: string
          description: ISO 4217 currency code
        status:
          $ref: "#/components/schemas/PaymentStatus"
        metadata:
          type: object
          description: |
            Payment Metadata attached at creation. When `metadata.merchant_reference`
            is supplied as a string, it is the Merchant Reference used by payment
            search on `GET /api/v1/payments`.
        created_at:
          type: string
          format: date-time
          description: When the Payment was created
        updated_at:
          type: string
          format: date-time
          description: When the Payment was last updated

    PaymentListItemResponse:
      type: object
      required:
        - id
        - merchant_id
        - amount_minor
        - currency
        - status
        - metadata
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Payment ID
        merchant_id:
          type: string
          format: uuid
          description: Owning Merchant Account ID
        amount_minor:
          type: integer
          description: Payment Amount in minor units
        currency:
          type: string
          description: ISO 4217 currency code
        status:
          $ref: "#/components/schemas/PaymentStatus"
        metadata:
          type: object
          description: |
            Payment Metadata attached at creation. When `metadata.merchant_reference`
            is supplied as a string, it is the Merchant Reference used by payment
            search on `GET /api/v1/payments`.
        created_at:
          type: string
          format: date-time
          description: When the Payment was created
        updated_at:
          type: string
          format: date-time
          description: When the Payment was last updated

    PaymentListResponse:
      type: object
      required:
        - items
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PaymentListItemResponse"
        limit:
          type: integer
          description: Maximum number of items returned
        offset:
          type: integer
          description: Number of items skipped

    PaymentStatus:
      type: string
      enum:
        - pending
        - processing
        - successful
        - failed
        - refunded
      description: Current status of the Payment lifecycle

    RefundStatus:
      type: string
      enum:
        - pending
        - processing
        - completed
        - failed
      description: Current status of the Refund lifecycle

    NotificationStatus:
      type: string
      enum:
        - pending
        - processing
        - delivered
        - failed
      description: Current status of a Notification Delivery Record

    PaymentStatusHistoryEntry:
      type: object
      required:
        - status
        - source_event_type
        - domain_event_id
        - occurred_at
      properties:
        status:
          $ref: "#/components/schemas/PaymentStatus"
        source_event_type:
          type: string
          description: |
            Domain Event that produced this Payment Status History entry (e.g. `payment.created`,
            `payment.processing`, `payment.successful`, `payment.failed`, `payment.refunded`,
            or a linked `refund.completed`).
        domain_event_id:
          type: string
          format: uuid
          description: Identifier of the source Domain Event
        occurred_at:
          type: string
          format: date-time
          description: When the source Domain Event was recorded
        details:
          type: object
          nullable: true
          description: |
            Optional event-specific context. For `payment.failed` events this includes a
            `failure_reason` field when present in the event payload.

    PaymentRefundSummary:
      type: object
      required:
        - id
        - payment_id
        - amount_minor
        - currency
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Refund ID
        payment_id:
          type: string
          format: uuid
          description: Owning Payment ID
        amount_minor:
          type: integer
          description: Refund amount in minor units
        currency:
          type: string
          description: ISO 4217 currency code
        status:
          $ref: "#/components/schemas/RefundStatus"
        created_at:
          type: string
          format: date-time
          description: When the Refund was created
        updated_at:
          type: string
          format: date-time
          description: When the Refund was last updated

    PaymentNotificationDeliveryRecord:
      type: object
      required:
        - id
        - domain_event_id
        - event_type
        - destination_url
        - status
        - attempt_count
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Notification Delivery Record ID
        domain_event_id:
          type: string
          format: uuid
          description: Domain Event this record delivers
        event_type:
          type: string
          description: Type of the related Domain Event (e.g. `payment.created`, `refund.completed`)
        destination_url:
          type: string
          format: uri
          description: Webhook destination URL
        status:
          $ref: "#/components/schemas/NotificationStatus"
        attempt_count:
          type: integer
          description: Number of delivery attempts made so far
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
          description: When delivery was last attempted
        next_retry_at:
          type: string
          format: date-time
          nullable: true
          description: When the next retry is scheduled (null when not pending)
        created_at:
          type: string
          format: date-time
          description: When the record was created
        updated_at:
          type: string
          format: date-time
          description: When the record was last updated

    PaymentDetailResponse:
      type: object
      required:
        - id
        - merchant_id
        - amount_minor
        - currency
        - status
        - metadata
        - created_at
        - updated_at
        - status_history
        - refunds
        - notification_delivery_records
      properties:
        id:
          type: string
          format: uuid
          description: Payment ID
        merchant_id:
          type: string
          format: uuid
          description: Owning Merchant Account ID
        amount_minor:
          type: integer
          description: Payment Amount in minor units
        currency:
          type: string
          description: ISO 4217 currency code
        status:
          $ref: "#/components/schemas/PaymentStatus"
        metadata:
          type: object
          description: |
            Payment Metadata attached at creation. When `metadata.merchant_reference`
            is supplied as a string, it is the Merchant Reference used by payment
            search on `GET /api/v1/payments`.
        created_at:
          type: string
          format: date-time
          description: When the Payment was created
        updated_at:
          type: string
          format: date-time
          description: When the Payment was last updated
        status_history:
          type: array
          description: |
            Ordered Payment Status History derived from Domain Events.
            Entries are ordered oldest to newest and include status changes
            caused by completed Refunds.
          items:
            $ref: "#/components/schemas/PaymentStatusHistoryEntry"
        refunds:
          type: array
          description: Related Refund summaries for this Payment
          items:
            $ref: "#/components/schemas/PaymentRefundSummary"
        notification_delivery_records:
          type: array
          description: |
            Notification Delivery Records related to this Payment and to its linked Refund events.
          items:
            $ref: "#/components/schemas/PaymentNotificationDeliveryRecord"

    AuditRecord:
      type: object
      required:
        - id
        - actor_type
        - action
        - resource_type
        - resource_id
        - occurred_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for this audit record
        actor_id:
          type: string
          format: uuid
          nullable: true
          description: Who performed the action (null when principal is unknown)
        actor_type:
          type: string
          enum: [merchant, administrator, system, unknown]
          description: Category of actor
        action:
          type: string
          description: The action performed (e.g., auth.authentication_failed, payment.created)
        resource_type:
          type: string
          description: Type of resource acted upon (e.g., auth, payment, refund)
        resource_id:
          type: string
          description: Identifier of the resource acted upon (may not be a UUID)
        details:
          type: object
          nullable: true
          description: Immutable payload with action-specific context
        occurred_at:
          type: string
          format: date-time
          description: When the action occurred
        created_at:
          type: string
          format: date-time
          description: When the audit record was persisted

    AuditRecordListResponse:
      type: object
      required:
        - items
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditRecord"
        limit:
          type: integer
          description: Maximum number of records returned
        offset:
          type: integer
          description: Number of records skipped
