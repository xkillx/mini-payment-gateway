openapi: "3.0.3"
info:
  title: Mini Payment Gateway API
  version: "0.1.0"
  description: Backend API for the Mini Payment Gateway MVP

servers:
  - url: http://localhost:4000
    description: Local development

paths:
  /health:
    get:
      operationId: health
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 0.1.0

  /api/v1/payments:
    get:
      operationId: listPayments
      summary: List payments (Merchant or Administrator)
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      operationId: createPayment
      summary: Create a payment (Merchant only)
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/payments/{id}:
    get:
      operationId: getPayment
      summary: Get a payment by ID (Merchant or Administrator)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/refunds:
    get:
      operationId: listRefunds
      summary: List refunds (Merchant or Administrator)
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      operationId: createRefund
      summary: Create a refund (Merchant only)
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/refunds/{id}:
    get:
      operationId: getRefund
      summary: Get a refund by ID (Merchant or Administrator)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/notifications:
    get:
      operationId: listNotifications
      summary: List notification delivery records (Administrator only)
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/notifications/{id}/retry:
    post:
      operationId: retryNotification
      summary: Retry a failed notification (Administrator only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/reconciliation:
    get:
      operationId: listReconciliations
      summary: List reconciliation records (Administrator only)
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      operationId: runReconciliation
      summary: Run a reconciliation (Administrator only)
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/audit:
    get:
      operationId: listAuditRecords
      summary: List audit records (Administrator only)
      security:
        - bearerAuth: []
      parameters:
        - name: actor_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by actor ID
        - name: actor_type
          in: query
          required: false
          schema:
            type: string
            enum: [merchant, administrator, system, unknown]
          description: Filter by actor type
        - name: resource_type
          in: query
          required: false
          schema:
            type: string
          description: Filter by resource type
        - name: resource_id
          in: query
          required: false
          schema:
            type: string
          description: Filter by resource ID
        - name: action
          in: query
          required: false
          schema:
            type: string
          description: Filter by action name
        - name: occurred_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Include records occurred at or after this timestamp
        - name: occurred_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Include records occurred at or before this timestamp
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum number of records to return
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of records to skip
      responses:
        "200":
          description: List of audit records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditRecordListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/audit/{id}:
    get:
      operationId: getAuditRecord
      summary: Get an audit record by ID (Administrator only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Audit record ID
      responses:
        "200":
          description: Audit record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/reporting/payment-summary:
    get:
      operationId: paymentSummary
      summary: Get payment summary report (Administrator only)
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/admin/actors:
    get:
      operationId: listActors
      summary: List actors (Administrator only)
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Authentication failed — missing, malformed, expired, or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: UNAUTHORIZED
            message: Authentication failed
            request_id: "01901234-5678-7000-8000-000000000001"

    Forbidden:
      description: Authenticated actor lacks the required role
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: FORBIDDEN
            message: Insufficient permissions
            request_id: "01901234-5678-7000-8000-000000000002"

    NotImplemented:
      description: Not Implemented
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ErrorEnvelope:
      type: object
      required:
        - code
        - message
        - request_id
      properties:
        code:
          type: string
          example: NOT_IMPLEMENTED
        message:
          type: string
          example: payments.list
        request_id:
          type: string
          format: uuid
        details:
          type: object
          nullable: true

    AuditRecord:
      type: object
      required:
        - id
        - actor_type
        - action
        - resource_type
        - resource_id
        - occurred_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for this audit record
        actor_id:
          type: string
          format: uuid
          nullable: true
          description: Who performed the action (null when principal is unknown)
        actor_type:
          type: string
          enum: [merchant, administrator, system, unknown]
          description: Category of actor
        action:
          type: string
          description: The action performed (e.g., auth.authentication_failed, payment.created)
        resource_type:
          type: string
          description: Type of resource acted upon (e.g., auth, payment, refund)
        resource_id:
          type: string
          description: Identifier of the resource acted upon (may not be a UUID)
        details:
          type: object
          nullable: true
          description: Immutable payload with action-specific context
        occurred_at:
          type: string
          format: date-time
          description: When the action occurred
        created_at:
          type: string
          format: date-time
          description: When the audit record was persisted

    AuditRecordListResponse:
      type: object
      required:
        - items
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditRecord"
        limit:
          type: integer
          description: Maximum number of records returned
        offset:
          type: integer
          description: Number of records skipped
